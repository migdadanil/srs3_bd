{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger shadow-sm">
            <div class="card-body">
                <h2 class="card-title text-danger mb-3">{{ title }}</h2>
                <p>Вы действительно хотите удалить <strong>{{ object }}</strong>?</p>
                <form method="post">
                    {% csrf_token %}
                    <button class="btn btn-danger" type="submit">Удалить</button>
                    <a class="btn btn-secondary" href="javascript:history.back()">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
